[project]
name = "rag-benchmark"
version = "0.1.0"
description = "Reproducible benchmarking platform for RAG pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-common>=1.1.28",
    "azure-cosmos>=4.16.3",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.30.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "langchain>=1.3.17",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.5",
    "openpyxl>=3.1.5",
    "pdf2image>=1.17.0",
    "pypdf>=6.16.2",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "boto3>=1.43.81",
    "jsonschema>=4.26.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "temporal/tests"]
# `src` is importable because `backend` is the source root, the same assumption
# `alembic.ini` encodes with `prepend_sys_path`; `.` makes the `temporal` worker package
# importable, which depends on `src` and never the other way round.
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: needs the docker-compose services (Postgres, MinIO) to be running",
]
